<style>
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:#f6f7ed;color:#203f32;font:16px/1.45 "Trebuchet MS",system-ui,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:4px solid #355dcc;outline-offset:3px}header,main{max-width:1180px;margin:auto;padding:0 28px}header{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center;font-weight:900;font-size:23px;letter-spacing:-1px}.logo{background:#234f3a;color:#e3f296;border-radius:12px;padding:3px 11px;font-size:26px}.meta{font-size:14px;font-weight:700}main{padding-bottom:36px}.hero{background:#e1ecd2;border-radius:22px;overflow:hidden;position:relative;isolation:isolate;min-height:198px;display:flex;align-items:center}.intro{padding:24px 32px;z-index:1}.tag{display:inline-block;font-size:12px;text-transform:uppercase;letter-spacing:1.7px;font-weight:800}.hero h1{font-size:clamp(32px,4.1vw,58px);line-height:.99;letter-spacing:-2.6px;margin:10px 0;color:#163f32}.hero p{margin:8px 0 0}.scenery{position:absolute;right:0;bottom:0;height:100%;width:48%}.bar{display:flex;align-items:center;gap:15px;margin:22px 0 15px}.pill{font-size:13px;font-weight:800;background:#e3eacb;border-radius:20px;padding:5px 12px}.track{margin-left:auto;width:105px;height:7px;background:#dce3d6;border-radius:10px;overflow:hidden}.track i{display:block;height:100%;background:#507c49}.count{font-size:14px}.board{background:#fffef9;border:1px solid #d9dfd0;border-radius:20px;padding:24px}h2,h3,p{margin:0}h2{font-size:clamp(22px,3vw,31px);letter-spacing:-1px;line-height:1.15}.hint{margin:7px 0 18px;color:#4b6054}.targets,.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.target{border:1px solid var(--edge);border-radius:16px;padding:16px;display:flex;flex-direction:column;background:var(--bg)}.target:nth-child(1){--bg:#e1efce;--edge:#a9c591}.target:nth-child(2){--bg:#ffebc6;--edge:#ddbe85}.target:nth-child(3){--bg:#e9e0f6;--edge:#c2acd5}.symbol{font-size:30px;line-height:1.3}.target h3{font-size:20px;margin:4px 0}.desc{font-size:15px;margin-bottom:14px}.slot{margin-top:auto;border:2px dashed var(--edge);background:#ffffff61;border-radius:11px;min-height:59px;width:100%;padding:8px;font-size:14px;font-weight:700}.slot.filled{background:#fffef8;border-style:solid}.slot.over{outline:3px solid #25614a}.traytitle{font-weight:800;margin:21px 0 10px}.card{background:white;border:1px solid #bcc7b8;box-shadow:0 3px 0 #dce1d5;border-radius:12px;min-height:55px;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;font-weight:700;touch-action:none}.grip{font-size:22px;color:#708374}.chosen{outline:3px solid #32694e}.ghost{position:fixed;z-index:10;pointer-events:none;background:#fffef9;color:#233f32;border:2px solid #397154;border-radius:12px;padding:10px 15px;box-shadow:0 7px 28px #173a3530;max-width:260px}.actions{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:19px;flex-wrap:wrap}.next,.back{min-height:45px;padding:9px 18px;border-radius:12px;font-weight:700}.next{margin-left:auto;background:#244e38;color:white;border:0}.next:disabled{opacity:.45;cursor:default}.back{background:white;border:1px solid #afbcae}.sr{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}.report{border-bottom:1px solid #dce1d5;padding:13px 0}.report b{display:block}.ok{color:#23613d}.bad{color:#8c411e}.result-title{margin-top:22px}.summary{border-radius:12px;background:#e5efcf;padding:16px;margin:14px 0}.empty{color:#546358;font-size:15px}.source{font-size:13px;color:#566b5b;margin-top:18px}
@media(max-width:760px){header,main{padding-left:14px;padding-right:14px}.board{padding:16px}.intro{padding:20px}.hero{min-height:166px}.targets,.cards{gap:8px}.target{padding:10px}.target h3{font-size:17px}.card{font-size:14px}.hero p{max-width:64%}}
@media(max-width:560px){header{height:57px}.meta{font-size:12px}.hero{min-height:152px}.hero h1{font-size:34px}.scenery{width:40%;opacity:.8}.hero p{font-size:14px}.targets,.cards{grid-template-columns:1fr}.target{display:grid;grid-template-columns:32px 1fr;gap:0 6px}.symbol{grid-row:1 / 3;font-size:24px}.target .desc{margin:0 0 7px}.slot{grid-column:1/-1;min-height:44px}.bar{gap:8px}.track{width:40px}.count{font-size:12px}.card{min-height:45px}}
</style></head><body><header><div class="brand"><span class="logo" aria-hidden="true">❧</span>Waldlabor</div><div class="meta">Natur und Technik · Klasse 8</div></header><main>
<section class="hero"><div class="intro"><span class="tag">Ökosystem Wald</span><h1>Der Stoffkreislauf<br>der Natur</h1><p>Was wird aus einem Blatt, wenn es zu Boden fällt?</p></div>
<svg class="scenery" viewBox="0 0 490 200" preserveAspectRatio="xMaxYMax slice" aria-hidden="true"><defs><g id="pine"><path fill="currentColor" d="M0 0l-16 32h8l-16 25h10l-20 32h29v18h10V89h29L14 57h10L8 32h8z"/></g></defs><circle cx="350" cy="51" r="32" fill="#ffc84d"/><path fill="#b1d1a3" d="M0 155Q84 78 173 106T328 92T490 68V200H0Z"/><path fill="#85b58c" d="M0 165Q97 124 178 140T329 117T490 118V200H0Z"/><g color="#528d73"><use href="#pine" transform="translate(345 84) scale(.78)"/><use href="#pine" transform="translate(396 58) scale(1)"/><use href="#pine" transform="translate(461 78) scale(.86)"/></g><path fill="#578f59" d="M0 184Q120 128 233 161T490 140V200H0Z"/><g color="#245f4e"><use href="#pine" transform="translate(453 12) scale(1.7)"/><use href="#pine" transform="translate(314 110) scale(.78)"/></g><path fill="#347249" d="M0 200Q105 157 205 181T390 174T500 158V210H0Z"/><g fill="#efad48"><ellipse cx="171" cy="177" rx="4" ry="2"/><ellipse cx="182" cy="174" rx="3" ry="2"/></g></svg></section>
<div id="game"></div><div id="live" class="sr" aria-live="polite"></div></main><script>
const rounds=[
{title:'Wer hat welche Aufgabe?',cards:['Eine Buche bildet in ihren Blättern Zucker.','Eine Raupe frisst ein Buchenblatt.','Bodenpilze und Bakterien bauen totes Laub ab.'],names:['Erzeuger','Verbraucher','Zersetzer'],icons:['🌱','🐛','🍄'],desc:['Produzenten bauen selbst energiereiche Stoffe auf.','Konsumenten nehmen Stoffe mit ihrer Nahrung auf.','Destruenten bauen abgestorbenes Material ab.'],why:['Die Buche nutzt Licht, Wasser und Kohlenstoffdioxid, um Zucker herzustellen. So ist sie ein Erzeuger.','Mit dem Blatt nimmt die Raupe Stoffe auf, die die Buche gebildet hat. Damit ist sie ein Verbraucher.','Bodenpilze und Bakterien zersetzen Laub. Dabei werden Mineralstoffe und Kohlenstoffdioxid frei.']},
{title:'Wie wandern die Stoffe weiter?',cards:['Stoffe aus dem Blatt gelangen in den Körper der Raupe.','Aus Resten werden Mineralstoffe frei. Kohlenstoffdioxid gelangt in die Luft.','Wurzeln nehmen Mineralstoffe auf. Blätter nutzen Kohlenstoffdioxid zum Aufbau von Zucker.'],names:['Vom Blatt zum Tier','Vom Laub zu freien Stoffen','Zurück in die Pflanze'],icons:['🍃','🍂','🌳'],desc:['Eine Raupe knabbert am Baum.','Pilze und Bakterien zersetzen ein gefallenes Blatt.','Eine junge Buche wächst.'],why:['Beim Fressen gelangen Stoffe vom Erzeuger zum Verbraucher. Die Raupe nutzt sie zum Beispiel für ihr Wachstum.','Zersetzer bauen abgestorbenes Material ab. So gelangen Mineralstoffe wieder in den Boden und Kohlenstoffdioxid in die Luft.','Die Buche nimmt Mineralstoffe aus dem Boden und Kohlenstoffdioxid aus der Luft auf. Die Stoffe werden wieder Teil eines Lebewesens.']}];
const game=document.querySelector('#game'),live=document.querySelector('#live');
let round,answers,orders,selected,drag,ignoreClick=false;
function start(){round=0;selected=null;answers=rounds.map(()=>[null,null,null]);orders=rounds.map(()=>{const a=[0,1,2];for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a});render()}
function total(){return answers.flat().filter(x=>x!==null).length}
function render(){if(round===2){results();return}const r=rounds[round],a=answers[round],free=orders[round].filter(id=>!a.includes(id));
game.innerHTML='<div class="bar"><span class="pill">Runde '+(round+1)+' von 2</span><span class="track"><i style="width:'+total()/6*100+'%"></i></span><span class="count">'+total()+' von 6 zugeordnet</span></div><section class="board"><h2 tabindex="-1">'+r.title+'</h2><p class="hint">Ziehe jede Karte ins passende Feld. Oder tippe erst die Karte und dann das Feld an.</p><div class="targets">'+r.names.map((n,i)=>'<section class="target"><span class="symbol" aria-hidden="true">'+r.icons[i]+'</span><h3>'+n+'</h3><p class="desc">'+r.desc[i]+'</p><button class="slot '+(a[i]===null?'':'filled')+'" data-slot="'+i+'" aria-label="'+n+' – '+(a[i]===null?'Karte ablegen':r.cards[a[i]]+' – antippen zum Zurücklegen')+'">'+(a[i]===null?'＋ Karte ablegen':r.cards[a[i]])+'</button></section>').join('')+'</div><div class="traytitle">Deine Karten</div><div class="cards">'+free.map(id=>'<button class="card '+(selected===id?'chosen':'')+'" aria-pressed="'+(selected===id)+'" data-card="'+id+'"><span class="grip" aria-hidden="true">⠿</span>'+r.cards[id]+'</button>').join('')+'</div>'+(!free.length?'<p class="empty">Alle Karten liegen. Tippe auf eine zugeordnete Karte, um sie zurückzulegen.</p>':'')+'<div class="actions">'+(round?'<button class="back" data-action="back">Zur ersten Runde</button>':'')+'<button class="next" data-action="next" '+(a.includes(null)?'disabled':'')+'>'+(round?'Auswerten':'Zur zweiten Runde')+'</button></div></section>'}
function assign(slot,id){answers[round][slot]=id;selected=null;live.textContent='Karte zugeordnet. '+total()+' von 6.';render();game.querySelector('[data-slot="'+slot+'"]').focus({preventScroll:true})}
function results(){const score=answers.flat().filter((v,i)=>v===i%3).length;game.innerHTML='<div class="bar"><span class="pill">Auswertung</span></div><section class="board"><h2 tabindex="-1">'+score+' von 6 Zuordnungen richtig</h2><p class="summary">Die Buche bildet Blätter, die Raupe frisst davon. Fallen Blätter zu Boden oder stirbt die Raupe, bauen Zersetzer die Reste ab. Dabei werden Stoffe frei, die Pflanzen wieder aufnehmen.</p>'+rounds.map((r,k)=>'<h3 class="result-title">'+r.title+'</h3>'+r.names.map((n,i)=>{const v=answers[k][i],ok=v===i;return '<div class="report"><b class="'+(ok?'ok':'bad')+'">'+(ok?'✓ Richtig':'↺ Schau noch einmal')+' · '+n+'</b><p>Deine Karte: '+r.cards[v]+'</p>'+(!ok?'<p><strong>Passend ist:</strong> '+r.cards[i]+'</p><p>'+r.why[i]+'</p>':'')+'</div>'}).join('')).join('')+'<div class="actions"><small>Grundlage: Lehrbuch, S. 87</small><button class="next" data-action="restart">Noch einmal spielen</button></div></section>'}
function focusTitle(){game.querySelector('h2').focus()}
game.addEventListener('click',e=>{if(ignoreClick)return;const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-card')){const id=+b.dataset.card;selected=selected===id?null:id;render();game.querySelector('[data-card="'+id+'"]').focus({preventScroll:true});return}if(b.hasAttribute('data-slot')){const i=+b.dataset.slot;if(selected!==null)assign(i,selected);else if(answers[round][i]!==null){const id=answers[round][i];answers[round][i]=null;render();game.querySelector('[data-card="'+id+'"]').focus({preventScroll:true});live.textContent='Karte zurückgelegt.'}return}if(b.dataset.action==='restart')start();else{round+=b.dataset.action==='back'?-1:1;selected=null;render()}focusTitle()});
game.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-card]');if(!b||!e.isPrimary||e.button!==0)return;drag={id:+b.dataset.card,p:e.pointerId,x:e.clientX,y:e.clientY,b};b.setPointerCapture(e.pointerId)});
function targetAt(e){return document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-slot]')}
document.addEventListener('pointermove',e=>{if(!drag||drag.p!==e.pointerId)return;if(!drag.ghost&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<7)return;if(!drag.ghost){drag.ghost=document.createElement('div');drag.ghost.className='ghost';drag.ghost.textContent=rounds[round].cards[drag.id];document.body.append(drag.ghost)}drag.ghost.style.left=Math.max(0,Math.min(innerWidth-drag.ghost.offsetWidth,e.clientX-30))+'px';drag.ghost.style.top=e.clientY+14+'px';const t=targetAt(e);game.querySelectorAll('.slot').forEach(b=>b.classList.toggle('over',b===t));if(e.clientY<65)window.scrollBy(0,-14);else if(e.clientY>innerHeight-65)window.scrollBy(0,14)});
function end(e){if(!drag||drag.p!==e.pointerId)return;const d=drag;drag=null;if(!d.ghost)return;d.ghost.remove();game.querySelectorAll('.over').forEach(b=>b.classList.remove('over'));ignoreClick=true;setTimeout(()=>ignoreClick=false,0);const t=targetAt(e);if(t&&e.type==='pointerup')assign(+t.dataset.slot,d.id)}
document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);start();
</script></body></html>
